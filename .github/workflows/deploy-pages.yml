name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            deepseek-v4.1-flash/package-lock.json
            glm-5.3/package-lock.json
            hy4-preview/package-lock.json

      # 三个子项目的 vite 均配置 base: "./",构建产物可托管在任意子路径
      - name: Install and build all sub-projects
        run: |
          set -euo pipefail
          for project in deepseek-v4.1-flash glm-5.3 hy4-preview; do
            echo "::group::$project: npm ci && npm run build"
            (cd "$project" && npm ci && npm run build)
            echo "::endgroup::"
          done

      - name: Assemble Pages site
        run: |
          set -euo pipefail
          mkdir -p site
          cp index.html site/
          touch site/.nojekyll
          for project in deepseek-v4.1-flash glm-5.3 hy4-preview; do
            mv "$project/dist" "site/$project"
          done
          ls -R site | head -40

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
